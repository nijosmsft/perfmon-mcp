name: Manual release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Must match pyproject version, for example v0.1.0."
        required: true
        type: string
      prerelease:
        description: "Mark this GitHub release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = uv run --python 3.11 python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $expectedTag = "v$version"
          $actualTag = "${{ inputs.tag }}"
          if ($actualTag -ne $expectedTag) {
            throw "Release tag '$actualTag' must match pyproject version '$version' ($expectedTag)."
          }

      - name: Run tests
        run: uv run --python 3.11 --group dev pytest tests/ -q

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $ghArgs = @(
            "release", "create", $tag,
            "--target", "$env:GITHUB_SHA",
            "--title", $tag,
            "--generate-notes"
          )
          if ("${{ inputs.prerelease }}" -eq "true") {
            $ghArgs += "--prerelease"
          }
          Get-ChildItem -Path dist -File | ForEach-Object {
            $ghArgs += $_.FullName
          }
          & gh @ghArgs

      - name: Update README Quick Install URL to point at this release
        if: ${{ inputs.prerelease != true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $version = $tag -replace '^v',''

          git fetch origin main
          git checkout -B main origin/main

          $readme = Get-Content README.md -Raw
          $original = $readme

          # Wheel download URLs: .../releases/download/vX.Y.Z/perfmon_mcp-X.Y.Z-py3-none-any.whl
          $readme = $readme -replace `
            'releases/download/v\d+\.\d+\.\d+/perfmon_mcp-\d+\.\d+\.\d+-py3-none-any\.whl', `
            "releases/download/$tag/perfmon_mcp-$version-py3-none-any.whl"

          if ($readme -eq $original) {
            Write-Host "README URLs already at $tag - nothing to update."
            exit 0
          }

          Set-Content README.md -Value $readme -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -s -m "docs: README - bump Quick Install URL to $tag" `
                       -m "Auto-generated by .github/workflows/release.yml after publishing $tag."
          git push origin main
