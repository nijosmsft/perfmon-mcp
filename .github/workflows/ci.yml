name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run --python 3.11 --group dev pytest tests/ -v

      - name: Verify server registers full tool surface
        run: uv run --python 3.11 python -c "import asyncio; from perfmon_mcp import server; print(f'Tools registered: {len(asyncio.run(server.mcp.list_tools()))}')"
